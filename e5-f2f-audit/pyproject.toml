[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e5-f2f-audit"
version = "0.1.0"
description = "Face-to-Face (F2F) / Plan-of-Care (POC) home-health audit agent orchestration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "E5" }]
keywords = ["home-health", "f2f", "audit", "deepagents", "langfuse", "orchestration"]

dependencies = [
    "deepagents>=0.6.12",
    "langchain-aws>=1.6.1",
    "langfuse>=4.14.1",
    "python-dotenv>=1.1.0",
    "botocore>=1.43.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# Convenience CLIs. `python -m e5_f2f_audit.run_<x>` keeps working too.
[project.scripts]
f2f-poc = "e5_f2f_audit.run_poc:main"
f2f-f2f = "e5_f2f_audit.run_f2f:main"
f2f-merge = "e5_f2f_audit.run_merge_encounters:main"
f2f-select = "e5_f2f_audit.run_selection:main"
f2f-audit = "e5_f2f_audit.run_audit:main"

# src-layout: the import package lives under src/.
[tool.setuptools.packages.find]
where = ["src"]
include = ["e5_f2f_audit*"]
exclude = ["e5_f2f_audit.tests*"]

# Ship the bundled prompts and skills so an installed wheel is self-contained
# (the agentic layer loads them at runtime). Runtime I/O dirs (ocr-markdown/,
# outputs/, soc_dates.json) are NOT packaged — they stay external and are
# overridable via OCR_MARKDOWN_DIR / OUTPUTS_DIR / SOC_DATES_FILE.
[tool.setuptools.package-data]
"e5_f2f_audit" = ["prompts/**/*.md", "skills/**/*.md"]
